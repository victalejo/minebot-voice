services:
  minebot:
    build: .
    container_name: minebot
    environment:
      AI_PROVIDER: "${AI_PROVIDER:-anthropic}"
      ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      AI_MODEL: "${AI_MODEL:-}"
      OPENAI_JSON_MODE: "${OPENAI_JSON_MODE:-json_object}"
      OPENAI_THINKING: "${OPENAI_THINKING:-}"
      OPENAI_REASONING_EFFORT: "${OPENAI_REASONING_EFFORT:-}"
      ACCESS_PASSWORD: "${ACCESS_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
      MINECRAFT_HOST: "${MINECRAFT_HOST:-minecraft}"
      MINECRAFT_PORT: "${MINECRAFT_PORT:-25565}"
      BOT_USERNAME: "${BOT_USERNAME:-MineBot}"
      BOT_NAME: "${BOT_NAME:-}"
      MC_AUTH_PASSWORD: "${MC_AUTH_PASSWORD:-}"
      PLANNER_ENABLED: "${PLANNER_ENABLED:-}"
      PLANNER_MODEL: "${PLANNER_MODEL:-}"
      PLANNER_THINKING: "${PLANNER_THINKING:-}"
      PLANNER_REASONING_EFFORT: "${PLANNER_REASONING_EFFORT:-}"
      DB_PATH: "/app/data/minebot.sqlite"
      MEMORY_DIR: "/app/data/memories"
      NODE_ENV: "production"
    expose:
      - 3001
    volumes:
      - minebot-data:/app/data
    networks:
      - dokploy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  minebot-data:

networks:
  dokploy-network:
    external: true
